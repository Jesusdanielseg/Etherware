<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etherware — Iniciar sesión</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="login-page">
<header class="public-header login-header">
    <div class="container navbar-content">
        <a href="../index.html" class="brand"><img class="brand-mark" src="../assets/img/etherware-marca-fresa.svg" alt="" aria-hidden="true">ETHERWARE</a>
        <nav class="public-nav" aria-label="Navegación principal">
            <a href="../index.html#inicio">Inicio</a><a href="../index.html#nosotros">Nosotros</a><a href="../index.html#productos">Productos</a><a href="login.html" class="active">Mi cuenta</a>
            <a class="header-cart" href="carrito.html" aria-label="Abrir carrito"><img src="../assets/img/carrito.svg" alt="" aria-hidden="true" width="22" height="22"></a>
        </nav>
    </div>
</header>
<main class="container">
    <section class="card login-card">
        <img class="login-image" src="../assets/img/login-fresas-crema.png" alt="Postre de fresas con crema">
        <div class="login-form-wrap">
            <h1>Iniciar sesión</h1>
            <form class="login-form">
                <label class="login-field"><img src="../assets/img/correo-login.png" alt="" aria-hidden="true" width="20" height="20"><input type="email" name="email" placeholder="Correo electrónico" aria-label="Correo electrónico" required></label>
                <label class="login-field"><img src="../assets/img/candado-login.png" alt="" aria-hidden="true" width="20" height="20"><input type="password" name="password" placeholder="Contraseña" aria-label="Contraseña" required></label>
                <a class="forgot" href="#">¿Olvidaste tu contraseña?</a>
                <label class="role-select" for="role"><b>Ingresar como:</b>
                    <select id="role" name="role">
                        <option value="administrador">Administrador</option>
                        <option value="repartidor">Domiciliario</option>
                    </select>
                </label>
                <div class="login-actions">
                    <a class="btn btn-secondary" href="../index.html">← Volver a la tienda</a>
                    <button class="btn btn-primary" type="submit">Iniciar sesión</button>
                </div>
            </form>
        </div>
    </section>
</main>
<script src="../js/app.js"></script>
</body>
</html>
